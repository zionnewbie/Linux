# Tokyo Night — Starship
# Alacritty + JetBrainsMono Nerd Font
# Fully local configuration
"$schema" = 'https://starship.rs/config-schema.json'
# ── Prompt ──────────────────────────────────────────────────────

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$line_break\
$character"""

right_format = "$cmd_duration$battery$time"

add_newline = false
scan_timeout = 10
command_timeout = 500


# ── Tokyo Night ─────────────────────────────────────────────────

palette = "tokyo_night"

[palettes.tokyo_night]
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
purple = "#ad8ee6"
cyan = "#449dab"
white = "#a9b1d6"


# ── OS ──────────────────────────────────────────────────────────

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold blue"

[os.symbols]
Linux = " "
Arch = " "
Artix = " "
CachyOS = " "
Debian = " "
Fedora = " "
Garuda = " "
Gentoo = " "
Kali = " "
Manjaro = " "
Mint = " "
NixOS = " "
OpenBSD = " "
Pop = " "
Raspbian = " "
RockyLinux = " "
Ubuntu = " "
Void = " "
Zorin = " "
Macos = " "
Windows = "󰍲 "
Unknown = " "


# ── Directory ───────────────────────────────────────────────────

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"

home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold red"

truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1


# ── Git ─────────────────────────────────────────────────────────

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

truncation_length = 24
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "bold red"

conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold yellow"


# ── Prompt character ────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"


# ── Command duration ────────────────────────────────────────────

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold yellow"


# ── Battery ─────────────────────────────────────────────────────

[battery]
format = "[$symbol$percentage]($style) "

full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"


# ── Time ────────────────────────────────────────────────────────

[time]
disabled = false
format = "[$time]($style)"
style = "bold cyan"
time_format = "%H:%M"
