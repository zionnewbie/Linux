
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = true

    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(ffffffff)

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 24
    font_family = $font
    color = rgba(ddddddff)

    position = 0, 30
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font
    color = rgba(ddddddff)

    position = 0, -105
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(ffffffff)
    inner_color = rgba(00000066)
    font_color = rgba(ffffffff)
    fade_on_empty = false

    placeholder_text = <i>Enter password...</i>
    hide_input = false

    position = 0, -180
    halign = center
    valign = center
}
EOF

echo "Created $CONFIG_FILE"
echo "Test it with: hyprlock --config \"$CONFIG_FILE\""

