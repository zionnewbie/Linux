[general]

[window]
# padding = { x = 1, y = 1 }
dynamic_padding = true
decorations = "None"
opacity = 0.75
blur = true            # opacity = 0.5
dynamic_title = true

[font]
normal = { family = "jetbrainsmono nerd font", style = "Regular" }
bold = { family = "jetbrainsmono nerd font", style = "Bold" }
italic = { family = "jetbrainsmono nerd font", style = "Italic" }
bold_italic = { family = "jetbrainsmono nerd font", style = "Bold Italic" }

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#73daca"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#73daca"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
# [colors.hints]
# start = { foreground = "#181818", background = "#f4bf75" }
# end = { foreground = "#181818", background = "#ac4242" }
[colors.hints]
start = { foreground = "#1a1b26", background = "#e0af68" }
end = { foreground = "#1a1b26", background = "#f7768e" }

# [bell]
# animation = "Ease"

[cursor]
style = { shape = "Block", blinking = "on" }

[mouse]
hide_when_typing = true

[debug]
render_timer = true
persistent_logging = false
