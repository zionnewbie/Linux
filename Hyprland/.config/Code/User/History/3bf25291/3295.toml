
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$character
"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = " [$branch]($style)"
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "bold red"

[python]
format = " [py $version]($style)"
style = "bold yellow"

[nodejs]
format = " [node $version]($style)"
style = "bold green"

[rust]
format = " [rust $version]($style)"
style = "bold red"

[golang]
format = " [go $version]($style)"
style = "bold cyan"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
