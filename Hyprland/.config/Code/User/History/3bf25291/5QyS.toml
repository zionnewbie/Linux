# ~/.config/starship.toml
# Generated by configurator.fyi/starship

add_newline = true
command_timeout = 500

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '

[username]
show_always = true
style_user = "bold yellow"
style_root = "bold red"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[status]
disabled = false
symbol = "✗ "
format = '[$symbol$status]($style) '

[jobs]
symbol = "+"
format = '[$symbol$number]($style) '

[os]
disabled = false

[sudo]
disabled = false

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[package]
disabled = true

[helm]
disabled = true

# Move the directory to the second line
format = '$all$directory$character'

# ~/.config/starship.toml

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold blue'
symbol = '🅰 '
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
[aws.profile_aliases]
CompanyGroupFrobozzOnCallAccess = 'Frobozz'
